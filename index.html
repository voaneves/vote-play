    <!--
      og:image PRECISA de URL absoluta: WhatsApp e Instagram não resolvem
      caminho relativo, e o Vite não reescreve atributo de <meta>. "/og.png"
      apontava para voaneves.github.io/og.png, que não existe — o link do show
      compartilhado aparecia sem imagem. Trocar junto com o domínio (Fase 9).
    -->
    <meta property="og:image" content="https://voaneves.github.io/vote-play/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

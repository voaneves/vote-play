<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#160A0E" />
    <meta name="color-scheme" content="dark" />

    <title>Vote Play — a próxima música do show é por sua conta</title>
    <meta
      name="description"
      content="Vote na próxima música do show pelo celular. Escaneie o QR Code, escolha a música e mande um Pix."
    />
    <meta name="author" content="Victor Neves" />
    <meta name="copyright" content="© 2026 Victor Neves. Todos os direitos reservados." />
    <link rel="author" href="https://voaneves.com" />

    <!--
      Ícones gerados por brand/gerar_icones.py a partir do símbolo do brandkit.
      O `?v=` é deliberado: navegador guarda favicon por URL durante meses, e
      uma URL nova obriga a buscar de novo. Ao mudar o desenho, suba o número nos três arquivos
      (este, site.webmanifest e public/sw.js).
    -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" href="/icon-180.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Vote Play" />
    <meta property="og:title" content="Vote Play" />
    <meta property="og:description" content="A próxima música do show é por sua conta." />
    <!--
      og:image PRECISA de URL absoluta: WhatsApp e Instagram não resolvem
      caminho relativo, e o Vite não reescreve atributo de <meta>. "/og.png"
      apontava para voaneves.github.io/og.png, que não existe — o link do show
      compartilhado aparecia sem imagem. O domínio é o voaneves.com: o
      github.io responde 302 para ele, e crawler de prévia nem sempre segue
      redirecionamento. Trocar junto com o domínio próprio (Fase 9).
    -->
    <meta property="og:image" content="https://voaneves.com/vote-play/og.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vote Play" />
    <meta name="twitter:description" content="A próxima música do show é por sua conta." />
    <meta name="twitter:image" content="https://voaneves.com/vote-play/og.png?v=2" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

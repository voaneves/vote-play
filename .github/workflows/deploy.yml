name: Deploy para GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        # `tsc --noEmit` na raiz NÃO checa nada: o tsconfig da raiz é de solução
        # (files: [] + references), então ele não abre arquivo algum. O script
        # aponta para os projetos de verdade. Isso já escondeu erro de tipo aqui.
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          # Chaves públicas por design — a segurança fica na RLS do Postgres.
          # A chave secreta (sb_secret_…) NUNCA entra aqui: o vite.config aborta
          # o build se encontrar uma em qualquer variável VITE_*.
          #
          # VITE_API_PROVIDER vai SEM valor padrão, de propósito. Esta linha já
          # foi `${{ vars.VITE_API_PROVIDER || 'mock' }}` e, sem a variável no
          # repositório, mandava 'mock' explícito para todo build — o forçado
          # ganha da configuração, então o site publicado rodava em memória
          # mesmo com URL e chave presentes, e um código de show real dava
          # "Código do show não encontrado".
          #
          # Sem a variável definida, isto chega como string vazia e o env.ts
          # trata como ausente: quem decide é a presença da URL e da chave.
          # Com ela em 'supabase', vira afirmação explícita — e o build QUEBRA
          # se a URL ou a chave faltarem, em vez de cair no mock calado.
          VITE_API_PROVIDER: ${{ vars.VITE_API_PROVIDER }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Fallback de SPA para links profundos
        # GitHub Pages não tem rewrite: /vote-play/s/DEMO01 devolve 404.
        # Servindo o próprio index.html como 404.html, a URL é preservada e o router assume.
        run: cp dist/index.html dist/404.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

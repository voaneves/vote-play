name: Deploy para GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          # Chaves públicas por design — a segurança fica na RLS do Postgres.
          # A service_role NUNCA entra no bundle.
          VITE_API_PROVIDER: ${{ vars.VITE_API_PROVIDER || 'mock' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Fallback de SPA para links profundos
        # GitHub Pages não tem rewrite: /vote-play/s/DEMO01 devolve 404.
        # Servindo o próprio index.html como 404.html, a URL é preservada e o router assume.
        run: cp dist/index.html dist/404.html

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
